# QoS overrides for recording PX4 topics
# PX4 publishes with BEST_EFFORT + VOLATILE via XRCE-DDS bridge.
# ros2 bag record defaults to RELIABLE, which can't match.

/fmu/out/vehicle_attitude:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/fmu/out/vehicle_local_position_v1:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/fmu/in/trajectory_setpoint:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/fmu/in/offboard_control_mode:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/fmu/in/vehicle_command:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10
